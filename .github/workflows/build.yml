
name: Build Xiaomi MM Sales Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        run: |
          test -f Xiaomi-MM-Sales-Tracker-completo.zip
          echo "Project ZIP found"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q Xiaomi-MM-Sales-Tracker-completo.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-MM-Sales-Tracker-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
